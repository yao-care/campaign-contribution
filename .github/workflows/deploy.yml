name: 建置並部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 首頁與 /countdown/ 顯示「距投票日 N 天」，是建置期算出來的靜態值，
  # 因此每日重建一次讓天數保持正確。台北時間 06:10。
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: '重新抓取外部資料（法條／村里／政黨）後再建置'
        type: boolean
        default: false

# runner 預設 UTC，但站上的「今天」指台北的今天——
# 導覽列的分期與首頁倒數天數都由建置期的當下決定。
env:
  TZ: Asia/Taipei

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；排隊中的舊任務直接取消，但不中斷進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 預設使用 repo 內已提交的資料檔，建置不依賴外部網站是否可用。
      # 需要更新資料時，用 workflow_dispatch 勾選 refresh_data 手動觸發。
      - name: 重新抓取外部資料
        if: inputs.refresh_data
        run: npm run data

      # 日期把關要在建置「之前」跑：日期算錯不會讓建置失敗，
      # 而 runner 在 UTC、開發機在 +08，錯的那一版只會在線上出現。
      - name: 日期把關
        run: npm run check:dates

      - name: 建置
        run: npm run build:only
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: 型別檢查
        run: npm run check

      - name: 內部連結檢查
        run: npm run check:links

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    # 只在推送到 main 時提交；排程重建不需要重新通知搜尋引擎。
    # 讀線上 sitemap，不必為了拿 URL 清單再建置一次。
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 提交 IndexNow
        run: node scripts/indexnow.mjs --live
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
